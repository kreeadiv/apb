<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed - APB: Calling All Plant Based Humans</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --leaf:#2d6a4f; --leaf-mid:#40916c; --leaf-light:#52b788;
  --leaf-pale:#d8f3dc; --leaf-xpale:#f0faf2;
  --cream:#fefae0; --dark:#141414; --muted:#6b7c72;
  --danger:#dc2626; --danger-pale:#fef2f2;
  --radius:14px;
}
html { scroll-behavior:smooth; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--dark);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card {
  background:white;
  border-radius:20px;
  border:1px solid rgba(45,106,79,0.1);
  max-width:420px;
  width:100%;
  padding:40px 36px;
  box-shadow:0 20px 60px rgba(45,106,79,0.08);
  text-align:center;
}

.logo { font-family:'Playfair Display',serif; font-size:20px; color:var(--leaf); margin-bottom:24px; }
.logo em { font-style:italic; color:var(--leaf-light); }

h1 { font-family:'Playfair Display',serif; font-size:24px; color:var(--dark); margin-bottom:8px; }
.subtitle { font-size:13px; color:var(--muted); line-height:1.6; }

.success-icon { font-size:40px; margin-bottom:12px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">APB <em>🌿</em></div>
  <div class="success-icon">✅</div>
  <h1>You're confirmed!</h1>
  <p class="subtitle">
    Your email is verified and your account is ready. Go back to the APB app and sign in to get started.
  </p>
</div>

</body>
</html>
